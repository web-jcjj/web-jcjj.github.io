<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Asistencia</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6 border border-slate-200">
    
    <!-- Encabezado / Información del Evento -->
    <div class="text-center mb-6">
      <div id="eventoBadge" class="inline-block bg-blue-100 text-blue-800 text-xs font-semibold px-3 py-1 rounded-full mb-2">
        Cargando evento...
      </div>
      <h1 class="text-2xl font-bold text-slate-800">Control de Asistencia</h1>
      <p id="subtituloEvento" class="text-slate-500 text-sm mt-1">Por favor, ingrese su DNI</p>
    </div>

    <!-- Búsqueda por DNI -->
    <div id="seccionBusqueda" class="space-y-4">
      <div>
        <label for="dniInput" class="block text-sm font-medium text-slate-700 mb-1">Número de DNI</label>
        <div class="relative">
          <input type="text" id="dniInput" maxlength="8" placeholder="Ingrese 8 dígitos" autofocus
            class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-slate-800 text-lg font-semibold tracking-wider transition-all">
          <i class="fa-solid fa-id-card absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-lg"></i>
        </div>
      </div>

      <button id="btnBuscar" onclick="buscarDNI()" 
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-xl shadow-md transition-all flex items-center justify-center gap-2 text-base">
        <i class="fa-solid fa-magnifying-glass"></i>
        <span>Buscar Asistencia</span>
      </button>
    </div>

    <!-- Indicador de Carga -->
    <div id="loading" class="hidden my-6 text-center text-slate-500 space-y-2">
      <i class="fa-solid fa-circle-notch fa-spin text-3xl text-blue-600"></i>
      <p id="loadingTexto" class="text-sm font-medium">Procesando petición...</p>
    </div>

    <!-- Mensajes de Resultado / Alertas -->
    <div id="mensajeResultado" class="hidden mt-6 p-4 rounded-xl text-center space-y-2"></div>

    <!-- Formulario de Registro (Para nuevos usuarios) -->
    <form id="formRegistro" onsubmit="registrarUsuario(event)" class="hidden mt-6 space-y-4 border-t border-slate-100 pt-4">
      <div class="bg-amber-50 border border-amber-200 text-amber-800 px-3 py-2 rounded-lg text-xs flex items-center gap-2">
        <i class="fa-solid fa-triangle-exclamation text-amber-600"></i>
        <span>El DNI no está registrado. Complete sus datos:</span>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">DNI</label>
        <input type="text" id="regDni" readonly class="w-full py-2 px-3 bg-slate-100 border border-slate-300 rounded-lg text-slate-600 font-bold text-sm cursor-not-allowed">
      </div>

      <div>
        <label for="regNombres" class="block text-xs font-semibold text-slate-600 mb-1">Nombres *</label>
        <input type="text" id="regNombres" required class="w-full py-2 px-3 border border-slate-300 rounded-lg text-slate-800 focus:ring-2 focus:ring-blue-500 text-sm">
      </div>

      <div>
        <label for="regApellidos" class="block text-xs font-semibold text-slate-600 mb-1">Apellidos *</label>
        <input type="text" id="regApellidos" required class="w-full py-2 px-3 border border-slate-300 rounded-lg text-slate-800 focus:ring-2 focus:ring-blue-500 text-sm">
      </div>

      <div>
        <label for="regConjunto" class="block text-xs font-semibold text-slate-600 mb-1">Conjunto / Delegación *</label>
        <select id="regConjunto" required class="w-full py-2 px-3 border border-slate-300 rounded-lg text-slate-800 focus:ring-2 focus:ring-blue-500 text-sm bg-white">
          <option value="">Seleccione una opción</option>
        </select>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label for="regTelefono" class="block text-xs font-semibold text-slate-600 mb-1">Teléfono</label>
          <input type="tel" id="regTelefono" class="w-full py-2 px-3 border border-slate-300 rounded-lg text-slate-800 focus:ring-2 focus:ring-blue-500 text-sm">
        </div>
        <div>
          <label for="regCorreo" class="block text-xs font-semibold text-slate-600 mb-1">Correo Electrónico</label>
          <input type="email" id="regCorreo" class="w-full py-2 px-3 border border-slate-300 rounded-lg text-slate-800 focus:ring-2 focus:ring-blue-500 text-sm">
        </div>
      </div>

      <div class="pt-2 flex gap-3">
        <button type="button" onclick="reiniciarVista()" class="w-1/3 bg-slate-200 hover:bg-slate-300 text-slate-700 py-2.5 rounded-xl text-sm font-semibold transition-all">
          Cancelar
        </button>
        <button type="submit" id="btnGuardar" class="w-2/3 bg-green-600 hover:bg-green-700 text-white py-2.5 rounded-xl text-sm font-semibold transition-all shadow-md">
          Registrar Asistencia
        </button>
      </div>
    </form>

  </div>

  <script>
    // URL desplegada de tu Google Apps Script
    const WEB_APP_URL = "TU_URL_DE_WEB_APP_AQUI"; 

    let permitirNuevosGlobal = false;

    document.addEventListener("DOMContentLoaded", () => {
      cargarInfoInicial();
      
      // Permitir presionar Enter en el input de DNI
      document.getElementById("dniInput").addEventListener("keypress", (e) => {
        if (e.key === "Enter") buscarDNI();
      });
    });

    async function cargarInfoInicial() {
      try {
        const res = await fetch(`${WEB_APP_URL}?action=obtener_info_inicial`);
        const data = await res.json();

        if (data.success) {
          permitirNuevosGlobal = data.permitirNuevos;

          if (data.evento) {
            document.getElementById("eventoBadge").textContent = `Evento: ${data.evento.nombre}`;
            document.getElementById("subtituloEvento").textContent = `Fecha: ${data.evento.fecha}`;
          } else {
            document.getElementById("eventoBadge").textContent = "Sin Evento Activo";
            document.getElementById("eventoBadge").className = "inline-block bg-red-100 text-red-800 text-xs font-semibold px-3 py-1 rounded-full mb-2";
          }

          // Poblar lista desplegable de conjuntos
          if (data.conjuntos && data.conjuntos.length > 0) {
            const select = document.getElementById("regConjunto");
            select.innerHTML = '<option value="">Seleccione una opción</option>';
            data.conjuntos.forEach(c => {
              const opt = document.createElement("option");
              opt.value = c;
              opt.textContent = c;
              select.appendChild(opt);
            });
          }
        }
      } catch (err) {
        console.error("Error al cargar información inicial:", err);
      }
    }

    async function buscarDNI() {
      const dni = document.getElementById("dniInput").value.trim();

      if (!dni || dni.length !== 8 || isNaN(dni)) {
        mostrarMensaje("error", "Por favor, ingrese un DNI válido de 8 dígitos.");
        return;
      }

      ocultarMensajes();
      mostrarLoading("Verificando DNI...");

      try {
        const res = await fetch(`${WEB_APP_URL}?action=buscar&dni=${dni}`);
        const data = await res.json();
        ocultarLoading();

        if (!data.success) {
          mostrarMensaje("error", data.message || "Ocurrió un error.");
          return;
        }

        // Caso 1: Ya registró asistencia en este evento
        if (data.yaRegistradoEnEvento) {
          mostrarMensaje("warning", `
            <div class="space-y-1">
              <p class="font-bold text-lg">¡Asistencia ya marcada!</p>
              <p class="text-sm">El usuario ya registró asistencia para este evento previamente.</p>
              <p class="text-xs opacity-75 mt-2">Fecha/Hora: ${data.fechaHoraAnterior}</p>
            </div>
          `);
          return;
        }

        // Caso 2: Registrado en la BD y asistencia marcada exitosamente
        if (data.encontrado) {
          mostrarMensaje("success", `
            <div class="space-y-1">
              <i class="fa-solid fa-circle-check text-4xl mb-2"></i>
              <p class="font-bold text-xl">¡Asistencia Marcada!</p>
              <p class="text-base font-semibold">${data.usuario.nombres} ${data.usuario.apellidos}</p>
              <p class="text-xs opacity-90">${data.usuario.conjunto || ""}</p>
            </div>
          `);
          setTimeout(reiniciarVista, 4000);
          return;
        }

        // Caso 3: Usuario NO existe en la BD
        if (!data.encontrado) {
          if (!permitirNuevosGlobal) {
            mostrarMensaje("error", "El DNI no está registrado en la lista de usuarios y el registro de nuevos usuarios no está habilitado.");
            return;
          }

          // Desplegar formulario autocompletando con datos de APIS Perú (RENIEC) si se obtuvieron
          document.getElementById("regDni").value = dni;
          document.getElementById("regNombres").value = data.datosReniec ? data.datosReniec.nombres : "";
          document.getElementById("regApellidos").value = data.datosReniec ? data.datosReniec.apellidos : "";

          document.getElementById("seccionBusqueda").classList.add("hidden");
          document.getElementById("formRegistro").classList.remove("hidden");
        }

      } catch (err) {
        ocultarLoading();
        mostrarMensaje("error", "Error de conexión con el servidor.");
        console.error(err);
      }
    }

    async function registrarUsuario(event) {
      event.preventDefault();

      const payload = {
        action: "registrar_nuevo",
        dni: document.getElementById("regDni").value,
        nombres: document.getElementById("regNombres").value.trim(),
        apellidos: document.getElementById("regApellidos").value.trim(),
        conjunto: document.getElementById("regConjunto").value,
        telefono: document.getElementById("regTelefono").value.trim(),
        correo: document.getElementById("regCorreo").value.trim()
      };

      mostrarLoading("Registrando usuario y marcando asistencia...");

      try {
        const res = await fetch(WEB_APP_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        ocultarLoading();

        if (data.success) {
          document.getElementById("formRegistro").classList.add("hidden");
          mostrarMensaje("success", `
            <div class="space-y-1">
              <i class="fa-solid fa-user-check text-4xl mb-2"></i>
              <p class="font-bold text-xl">¡Registro Exitoso!</p>
              <p class="text-base font-semibold">${data.nombres} ${data.apellidos}</p>
              <p class="text-xs">Asistencia registrada correctamente.</p>
            </div>
          `);
          setTimeout(reiniciarVista, 4000);
        } else {
          mostrarMensaje("error", data.message || "Error al registrar el usuario.");
        }
      } catch (err) {
        ocultarLoading();
        mostrarMensaje("error", "Error de conexión al guardar los datos.");
        console.error(err);
      }
    }

    function mostrarLoading(texto) {
      document.getElementById("loadingTexto").textContent = texto;
      document.getElementById("loading").classList.remove("hidden");
    }

    function ocultarLoading() {
      document.getElementById("loading").classList.add("hidden");
    }

    function mostrarMensaje(tipo, htmlContent) {
      const el = document.getElementById("mensajeResultado");
      el.className = "mt-6 p-4 rounded-xl text-center shadow-sm space-y-2 ";

      if (tipo === "success") {
        el.className += "bg-green-50 text-green-800 border border-green-200";
      } else if (tipo === "warning") {
        el.className += "bg-amber-50 text-amber-800 border border-amber-200";
      } else {
        el.className += "bg-red-50 text-red-800 border border-red-200";
      }

      el.innerHTML = htmlContent;
      el.classList.remove("hidden");
    }

    function ocultarMensajes() {
      document.getElementById("mensajeResultado").classList.add("hidden");
    }

    function reiniciarVista() {
      document.getElementById("dniInput").value = "";
      document.getElementById("formRegistro").reset();
      document.getElementById("formRegistro").classList.add("hidden");
      document.getElementById("seccionBusqueda").classList.remove("hidden");
      ocultarMensajes();
      document.getElementById("dniInput").focus();
    }
  </script>
</body>
</html>
