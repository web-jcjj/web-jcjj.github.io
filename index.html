<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Control de Asistencia</title>

  <!-- LIBRERÍA PARA LECTOR DE CÓDIGO QR -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * { 
      box-sizing: border-box; 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    }

    body { 
      background-color: #f3f4f6; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0; 
      padding: 16px; 
    }

    .card { 
      background: #ffffff; 
      padding: 28px 24px; 
      border-radius: 16px; 
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1); 
      width: 100%; 
      max-width: 420px; 
      margin: auto; 
    }

    h2 { margin-top: 0; color: #1f2937; text-align: center; margin-bottom: 12px; font-size: 22px; }
    
    .event-badge { 
      background-color: #ecfdf5; 
      color: #065f46; 
      border: 1px solid #a7f3d0; 
      padding: 12px 14px; 
      border-radius: 8px; 
      font-size: 14px; 
      text-align: center; 
      font-weight: 600; 
      margin-bottom: 20px; 
      cursor: default;
    }
    
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; color: #374151; font-size: 14px; }
    input, select { 
      width: 100%; 
      padding: 12px; 
      border: 1px solid #d1d5db; 
      border-radius: 8px; 
      font-size: 16px; 
      background-color: white; 
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus { border-color: #2563eb; }

    button { 
      width: 100%; 
      padding: 13px; 
      background-color: #2563eb; 
      color: white; 
      border: none; 
      border-radius: 8px; 
      font-weight: bold; 
      cursor: pointer; 
      font-size: 15px; 
      margin-top: 5px; 
      transition: background-color 0.2s;
    }
    button:hover { background-color: #1d4ed8; }
    button:disabled { background-color: #9ca3af; cursor: not-allowed; }
    .btn-success { background-color: #059669; }
    .btn-success:hover { background-color: #047857; }
    .btn-secondary { background-color: #4b5563; }
    .btn-secondary:hover { background-color: #374151; }
    
    .hidden { display: none; }
    .alert { padding: 12px; border-radius: 8px; margin-top: 15px; font-size: 14px; text-align: center; }
    .alert-error { background-color: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
    .alert-info { background-color: #e0f2fe; color: #075985; border: 1px solid #bae6fd; }
    
    .status-box { text-align: center; padding: 10px 5px; }
    .icon-success { font-size: 48px; color: #059669; margin-bottom: 8px; }
    .icon-warning { font-size: 48px; color: #d97706; margin-bottom: 8px; }

    /* ESTILOS DEL ESCÁNER QR */
    #reader {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 15px;
      border: 2px dashed #cbd5e1;
    }
    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 15px 0;
      color: #9ca3af;
      font-size: 13px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid #e5e7eb;
    }
    .divider::before { margin-right: .5em; }
    .divider::after { margin-left: .5em; }
  </style>
</head>
<body>

<div class="card">
  <h2>Control de Asistencia</h2>
  <div id="event-badge" class="event-badge">Cargando evento activo...</div>

  <!-- Paso 1: Buscar DNI o Escanear QR -->
  <div id="step-search">
    
    <!-- Contenedor dinámico del escáner -->
    <div id="qr-container" class="hidden">
      <div id="reader"></div>
      <button type="button" class="btn-secondary" onclick="detenerEscaner()">Cancelar Escaneo</button>
    </div>

    <!-- Formulario Tradicional de DNI -->
    <div id="dni-container">
      <button type="button" class="btn-secondary" id="btn-qr" onclick="iniciarEscaner()" style="margin-bottom: 15px; background-color: #0f766e;">
        📷 Escanear Código QR
      </button>

      <div class="divider">O INGRESE MANUALMENTE</div>

      <div class="form-group">
        <label for="dni">Número de DNI</label>
        <input type="text" id="dni" placeholder="Ingrese DNI" maxlength="8" pattern="[0-9]*" inputmode="numeric" required autofocus />
      </div>
      <button type="button" id="btn-buscar" onclick="buscarUsuario()">Buscar y Registrar Asistencia</button>
    </div>

  </div>

  <!-- Paso 2: Nuevo Registro -->
  <div id="step-register" class="hidden">
    <div class="form-group">
      <label for="reg-dni">DNI a Registrar *</label>
      <input type="text" id="reg-dni" readonly style="background-color: #f3f4f6; color: #1f2937; font-weight: bold; cursor: not-allowed;" />
    </div>
    <div class="form-group">
      <label for="nombres">Nombres *</label>
      <input type="text" id="nombres" required />
    </div>
    <div class="form-group">
      <label for="apellidos">Apellidos *</label>
      <input type="text" id="apellidos" required />
    </div>
    <div class="form-group">
      <label for="conjunto">Conjunto *</label>
      <select id="conjunto" required>
        <option value="">Cargando opciones...</option>
      </select>
    </div>
    <div class="form-group">
      <label for="telefono">Teléfono (Opcional)</label>
      <input type="tel" id="telefono" />
    </div>
    <div class="form-group">
      <label for="correo">Correo (Opcional)</label>
      <input type="email" id="correo" />
    </div>
    <button type="button" class="btn-success" id="btn-guardar" onclick="registrarNuevo()">Guardar y Marcar Asistencia</button>
    <button type="button" style="background:#6b7280; margin-top:8px;" onclick="resetForm()">Volver</button>
  </div>

  <!-- Paso 3A: Registro Exitoso -->
  <div id="step-success" class="hidden status-box">
    <div class="icon-success">✓</div>
    <h3 style="color: #059669; margin-bottom: 8px;">¡Asistencia Registrada!</h3>
    <p id="success-message-text" style="color: #374151; font-size: 15px; margin-bottom: 20px; line-height: 1.4;"></p>
    <button type="button" class="btn-success" onclick="resetForm()">Registrar Otra Asistencia</button>
  </div>

  <!-- Paso 3B: Ya Registrado previamente -->
  <div id="step-warning" class="hidden status-box">
    <div class="icon-warning">⚠️</div>
    <h3 style="color: #d97706; margin-bottom: 8px;">¡Asistencia Ya Registrada!</h3>
    <p id="warning-message-text" style="color: #374151; font-size: 15px; margin-bottom: 20px; line-height: 1.4;"></p>
    <button type="button" style="background:#2563eb;" onclick="resetForm()">Entendido / Volver</button>
  </div>

  <!-- Mensajes de estado -->
  <div id="status-message"></div>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby4seyhhepXTXdmt0HSjM0i-rfvqQVElXmihx_6DiVRTnpG_yKNBPE7Rs6q3pBUhGvs/exec";

  let currentDNI = "";
  let html5QrCode = null;
  let isProcessingScan = false; // Bandera para evitar peticiones duplicadas

  document.addEventListener("DOMContentLoaded", () => {
    cargarInfoInicial();

    document.getElementById("dni").addEventListener("keypress", function(event) {
      if (event.key === "Enter") {
        event.preventDefault();
        // Limpia caracteres no numéricos y recorta a 8 por si se usa pistola láser
        this.value = this.value.replace(/[^0-9]/g, '').substring(0, 8);
        buscarUsuario();
      }
    });

    document.getElementById("dni").addEventListener("input", function(e) {
      this.value = this.value.replace(/[^0-9]/g, '');
    });
  });

  /* ===================================================
     LÓGICA DEL ESCÁNER DE CÓDIGO QR (OPTIMIZADA)
     =================================================== */
  async function iniciarEscaner() {
    clearMessage();
    document.getElementById("qr-container").classList.remove("hidden");
    document.getElementById("dni-container").classList.add("hidden");
    
    isProcessingScan = false; // Reseteamos la bandera

    // Limpia instancia anterior para evitar parpadeos/bloqueos
    if (html5QrCode) {
      try { await html5QrCode.clear(); } catch(e) {}
    }

    html5QrCode = new Html5Qrcode("reader");
    const config = { fps: 10, qrbox: { width: 220, height: 220 } };

    html5QrCode.start(
      { facingMode: "environment" }, 
      config, 
      onScanSuccess
    ).catch(err => {
      showMessage("No se pudo acceder a la cámara o el navegador bloqueó el permiso.", "error");
      detenerEscaner();
    });
  }

  async function onScanSuccess(decodedText) {
    if (isProcessingScan) return; // Ignora lecturas adicionales mientras procesa
    isProcessingScan = true;

    let dniLimpio = decodedText.trim().replace(/[^0-9]/g, '');
    
    if (dniLimpio.length > 8) {
      dniLimpio = dniLimpio.substring(0, 8);
    }

    if (dniLimpio) {
      await detenerEscaner(); // Espera a liberar la cámara antes de llamar a la API
      document.getElementById("dni").value = dniLimpio;
      await buscarUsuario();
    } else {
      showMessage("El código QR no contiene un DNI válido.", "error");
    }
    
    isProcessingScan = false;
  }

  async function detenerEscaner() {
    if (html5QrCode && html5QrCode.isScanning) {
      try {
        await html5QrCode.stop();
        html5QrCode.clear();
      } catch (err) {
        console.warn("Error al detener cámara:", err);
      } finally {
        ocultarUIEscaner();
      }
    } else {
      ocultarUIEscaner();
    }
  }

  function ocultarUIEscaner() {
    document.getElementById("qr-container").classList.add("hidden");
    document.getElementById("dni-container").classList.remove("hidden");
  }

  /* ===================================================
     FLUJO PRINCIPAL DE ASISTENCIA
     =================================================== */
  async function cargarInfoInicial() {
    try {
      const response = await fetch(`${SCRIPT_URL}?action=obtener_info_inicial`);
      const result = await response.json();
      
      if (result.success) {
        if (result.evento) {
          document.getElementById("event-badge").innerHTML = `📍 <strong>Evento Activo:</strong> ${result.evento.nombre}`;
        } else {
          document.getElementById("event-badge").innerHTML = "⚠️ <strong>No hay eventos activos</strong>";
        }
        if (result.conjuntos) {
          poblarComboConjuntos(result.conjuntos);
        }
      }
    } catch (e) {
      document.getElementById("event-badge").innerText = "Error al cargar el evento";
    }
  }

  function poblarComboConjuntos(lista) {
    const select = document.getElementById("conjunto");
    select.innerHTML = '<option value="">-- Seleccione un Conjunto --</option>';
    lista.forEach(item => {
      const option = document.createElement("option");
      option.value = item;
      option.textContent = item;
      select.appendChild(option);
    });
  }

  async function buscarUsuario() {
    const dniInput = document.getElementById("dni").value.trim();
    if (!dniInput) {
      showMessage("Ingrese un número de DNI", "error");
      return;
    }

    currentDNI = dniInput;
    showMessage("Validando información...", "info");
    document.getElementById("btn-buscar").disabled = true;

    try {
      const response = await fetch(`${SCRIPT_URL}?action=buscar&dni=${encodeURIComponent(dniInput)}`);
      const result = await response.json();

      document.getElementById("btn-buscar").disabled = false;

      if (result.success) {
        if (result.yaRegistradoEnEvento) {
          showWarningScreen(`El DNI <strong>${currentDNI}</strong> ya registró asistencia previamente para el evento <strong>"${result.evento.nombre}"</strong>.`);
        } else if (result.encontrado && result.asistenciaMarcada) {
          showSuccessScreen(`¡Bienvenido/a <strong>${result.usuario.nombres} ${result.usuario.apellidos}</strong>!<br>Tu asistencia ha sido registrada para <strong>"${result.evento.nombre}"</strong>.`);
        } else {
          clearMessage();
          if (result.conjuntos) poblarComboConjuntos(result.conjuntos);
          
          // Asigna el DNI ingresado al nuevo campo de texto readonly
          document.getElementById("reg-dni").value = currentDNI;
          
          document.getElementById("step-search").classList.add("hidden");
          document.getElementById("step-register").classList.remove("hidden");
        }
      } else {
        showMessage("Error: " + result.message, "error");
      }
    } catch (error) {
      document.getElementById("btn-buscar").disabled = false;
      showMessage("Error al conectar con la base de datos.", "error");
    }
  }

  async function registrarNuevo() {
    const nombres = document.getElementById("nombres").value.trim();
    const apellidos = document.getElementById("apellidos").value.trim();
    const conjunto = document.getElementById("conjunto").value.trim();
    const telefono = document.getElementById("telefono").value.trim();
    const correo = document.getElementById("correo").value.trim();

    if (!nombres || !apellidos || !conjunto) {
      showMessage("Por favor complete Nombres, Apellidos y seleccione un Conjunto.", "error");
      return;
    }

    showMessage("Guardando registro y marcando asistencia...", "info");
    document.getElementById("btn-guardar").disabled = true;

    try {
      const response = await fetch(SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          action: "registrar_nuevo",
          dni: currentDNI,
          nombres: nombres,
          apellidos: apellidos,
          conjunto: conjunto,
          telefono: telefono,
          correo: correo
        })
      });
      const result = await response.json();

      document.getElementById("btn-guardar").disabled = false;

      if (result.success) {
        showSuccessScreen(`¡Bienvenido/a <strong>${result.nombres} ${result.apellidos}</strong>!<br>Tus datos fueron guardados y tu asistencia fue marcada para <strong>"${result.evento.nombre}"</strong>.`);
      } else {
        showMessage("Error: " + result.message, "error");
      }
    } catch (error) {
      document.getElementById("btn-guardar").disabled = false;
      showMessage("Error de conexión al guardar los datos.", "error");
    }
  }

  function showSuccessScreen(htmlText) {
    clearMessage();
    hideAllSteps();
    document.getElementById("success-message-text").innerHTML = htmlText;
    document.getElementById("step-success").classList.remove("hidden");
  }

  function showWarningScreen(htmlText) {
    clearMessage();
    hideAllSteps();
    document.getElementById("warning-message-text").innerHTML = htmlText;
    document.getElementById("step-warning").classList.remove("hidden");
  }

  function hideAllSteps() {
    document.getElementById("step-search").classList.add("hidden");
    document.getElementById("step-register").classList.add("hidden");
    document.getElementById("step-success").classList.add("hidden");
    document.getElementById("step-warning").classList.add("hidden");
  }

  function resetForm() {
    detenerEscaner();
    hideAllSteps();
    document.getElementById("step-search").classList.remove("hidden");

    document.getElementById("dni").value = "";
    document.getElementById("reg-dni").value = "";
    document.getElementById("nombres").value = "";
    document.getElementById("apellidos").value = "";
    document.getElementById("conjunto").value = "";
    document.getElementById("telefono").value = "";
    document.getElementById("correo").value = "";
    currentDNI = "";
    clearMessage();
    document.getElementById("dni").focus();
  }

  function showMessage(msg, type) {
    const container = document.getElementById("status-message");
    container.className = `alert alert-${type}`;
    container.innerText = msg;
  }

  function clearMessage() {
    const container = document.getElementById("status-message");
    container.className = "";
    container.innerText = "";
  }
</script>

</body>
</html>
