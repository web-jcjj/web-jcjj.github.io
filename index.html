<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Asistencia</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f3f4f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
    .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 480px; }
    h2 { margin-top: 0; color: #1f2937; text-align: center; margin-bottom: 5px; }
    .event-badge { background-color: #059669; color: white; padding: 10px 14px; border-radius: 8px; font-size: 14px; text-align: center; font-weight: bold; margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: 600; color: #374151; font-size: 14px; }
    input, select { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 15px; background-color: white; }
    button { width: 100%; padding: 12px; background-color: #2563eb; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 15px; margin-top: 5px; }
    button:hover { background-color: #1d4ed8; }
    button:disabled { background-color: #9ca3af; cursor: not-allowed; }
    .btn-success { background-color: #059669; }
    .btn-success:hover { background-color: #047857; }
    .hidden { display: none; }
    .alert { padding: 12px; border-radius: 6px; margin-top: 15px; font-size: 14px; text-align: center; }
    .alert-error { background-color: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
    .alert-info { background-color: #e0f2fe; color: #075985; border: 1px solid #bae6fd; }
    
    .status-box { text-align: center; padding: 20px 10px; }
    .icon-success { font-size: 50px; color: #059669; margin-bottom: 10px; }
    .icon-warning { font-size: 50px; color: #d97706; margin-bottom: 10px; }
  </style>
</head>
<body>

<div class="card">
  <h2>Control de Asistencia</h2>
  <!-- Muestra el evento activo limpiamente -->
  <div id="event-badge" class="event-badge">Cargando evento activo...</div>

  <!-- Paso 1: Buscar DNI -->
  <div id="step-search">
    <div class="form-group">
      <label for="dni">Número de DNI</label>
      <input type="text" id="dni" placeholder="Ingrese DNI" maxlength="15" required autofocus />
    </div>
    <button type="button" id="btn-buscar" onclick="buscarUsuario()">Buscar y Registrar Asistencia</button>
  </div>

  <!-- Paso 2: Nuevo Registro -->
  <div id="step-register" class="hidden">
    <div class="alert alert-info" style="margin-bottom:15px;">
      El DNI no está registrado. Ingrese sus datos para completar el registro.
    </div>
    <div class="form-group">
      <label for="nombres">Nombres *</label>
      <input type="text" id="nombres" required />
    </div>
    <div class="form-group">
      <label for="apellidos">Apellidos *</label>
      <input type="text" id="apellidos" required />
    </div>
    <div class="form-group">
      <label for="conjunto">Conjunto *</label>
      <select id="conjunto" required>
        <option value="">Cargando opciones...</option>
      </select>
    </div>
    <div class="form-group">
      <label for="telefono">Teléfono (Opcional)</label>
      <input type="tel" id="telefono" />
    </div>
    <div class="form-group">
      <label for="correo">Correo (Opcional)</label>
      <input type="email" id="correo" />
    </div>
    <button type="button" class="btn-success" id="btn-guardar" onclick="registrarNuevo()">Guardar y Marcar Asistencia</button>
    <button type="button" style="background:#6b7280; margin-top:8px;" onclick="resetForm()">Volver</button>
  </div>

  <!-- Paso 3A: Registro Exitoso -->
  <div id="step-success" class="hidden status-box">
    <div class="icon-success">✓</div>
    <h3 style="color: #059669; margin-bottom: 8px;">¡Asistencia Registrada!</h3>
    <p id="success-message-text" style="color: #374151; font-size: 15px; margin-bottom: 20px; line-height: 1.4;"></p>
    <button type="button" class="btn-success" onclick="resetForm()">Registrar Otra Asistencia</button>
  </div>

  <!-- Paso 3B: Ya Registrado previamente -->
  <div id="step-warning" class="hidden status-box">
    <div class="icon-warning">⚠️</div>
    <h3 style="color: #d97706; margin-bottom: 8px;">¡Asistencia Ya Registrada!</h3>
    <p id="warning-message-text" style="color: #374151; font-size: 15px; margin-bottom: 20px; line-height: 1.4;"></p>
    <button type="button" style="background:#2563eb;" onclick="resetForm()">Entendido / Volver</button>
  </div>

  <!-- Mensajes de estado -->
  <div id="status-message"></div>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzC2YOWkLIBYojLarWOCEIeSdHuw2m8Wy0OKLJ69idr98lLve8rW6cHUL-kZWwUniwz/exec";

  let currentDNI = "";

  document.addEventListener("DOMContentLoaded", cargarInfoInicial);

  async function cargarInfoInicial() {
    try {
      const response = await fetch(`${SCRIPT_URL}?action=obtener_info_inicial`);
      const result = await response.json();
      
      if (result.success) {
        if (result.evento) {
          // MUESTRA LIMPIAMENTE EL NOMBRE DEL EVENTO ACTIVO
          document.getElementById("event-badge").innerText = `Evento Activo: ${result.evento.nombre}`;
        } else {
          document.getElementById("event-badge").innerText = "⚠️ No hay eventos activos";
        }
        if (result.conjuntos) {
          poblarComboConjuntos(result.conjuntos);
        }
      }
    } catch (e) {
      document.getElementById("event-badge").innerText = "Error al cargar el evento";
    }
  }

  function poblarComboConjuntos(lista) {
    const select = document.getElementById("conjunto");
    select.innerHTML = '<option value="">-- Seleccione un Conjunto --</option>';
    lista.forEach(item => {
      const option = document.createElement("option");
      option.value = item;
      option.textContent = item;
      select.appendChild(option);
    });
  }

  async function buscarUsuario() {
    const dniInput = document.getElementById("dni").value.trim();
    if (!dniInput) {
      showMessage("Ingrese un número de DNI", "error");
      return;
    }

    currentDNI = dniInput;
    showMessage("Validando información...", "info");
    document.getElementById("btn-buscar").disabled = true;

    try {
      const response = await fetch(`${SCRIPT_URL}?action=buscar&dni=${encodeURIComponent(dniInput)}`);
      const result = await response.json();

      document.getElementById("btn-buscar").disabled = false;

      if (result.success) {
        if (result.yaRegistradoEnEvento) {
          showWarningScreen(`El DNI <strong>${currentDNI}</strong> ya registró asistencia previamente para el evento <strong>"${result.evento.nombre}"</strong>.`);
        } else if (result.encontrado && result.asistenciaMarcada) {
          showSuccessScreen(`¡Bienvenido/a <strong>${result.usuario.nombres} ${result.usuario.apellidos}</strong>!<br>Tu asistencia ha sido registrada para <strong>"${result.evento.nombre}"</strong>.`);
        } else {
          clearMessage();
          if (result.conjuntos) poblarComboConjuntos(result.conjuntos);
          document.getElementById("step-search").classList.add("hidden");
          document.getElementById("step-register").classList.remove("hidden");
        }
      } else {
        showMessage("Error: " + result.message, "error");
      }
    } catch (error) {
      document.getElementById("btn-buscar").disabled = false;
      showMessage("Error al conectar con la base de datos.", "error");
    }
  }

  async function registrarNuevo() {
    const nombres = document.getElementById("nombres").value.trim();
    const apellidos = document.getElementById("apellidos").value.trim();
    const conjunto = document.getElementById("conjunto").value.trim();
    const telefono = document.getElementById("telefono").value.trim();
    const correo = document.getElementById("correo").value.trim();

    if (!nombres || !apellidos || !conjunto) {
      showMessage("Por favor complete Nombres, Apellidos y seleccione un Conjunto.", "error");
      return;
    }

    showMessage("Guardando registro y marcando asistencia...", "info");
    document.getElementById("btn-guardar").disabled = true;

    const payload = {
      action: "registrar_nuevo",
      dni: currentDNI,
      nombres: nombres,
      apellidos: apellidos,
      conjunto: conjunto,
      telefono: telefono,
      correo: correo
    };

    try {
      const response = await fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      });
      const result = await response.json();

      document.getElementById("btn-guardar").disabled = false;

      if (result.success) {
        showSuccessScreen(`¡Bienvenido/a <strong>${result.nombres} ${result.apellidos}</strong>!<br>Tus datos fueron guardados y tu asistencia fue marcada para <strong>"${result.evento.nombre}"</strong>.`);
      } else {
        showMessage("Error: " + result.message, "error");
      }
    } catch (error) {
      document.getElementById("btn-guardar").disabled = false;
      showMessage("Error de conexión al guardar los datos.", "error");
    }
  }

  function showSuccessScreen(htmlText) {
    clearMessage();
    hideAllSteps();
    document.getElementById("success-message-text").innerHTML = htmlText;
    document.getElementById("step-success").classList.remove("hidden");
  }

  function showWarningScreen(htmlText) {
    clearMessage();
    hideAllSteps();
    document.getElementById("warning-message-text").innerHTML = htmlText;
    document.getElementById("step-warning").classList.remove("hidden");
  }

  function hideAllSteps() {
    document.getElementById("step-search").classList.add("hidden");
    document.getElementById("step-register").classList.add("hidden");
    document.getElementById("step-success").classList.add("hidden");
    document.getElementById("step-warning").classList.add("hidden");
  }

  function resetForm() {
    hideAllSteps();
    document.getElementById("step-search").classList.remove("hidden");

    document.getElementById("dni").value = "";
    document.getElementById("nombres").value = "";
    document.getElementById("apellidos").value = "";
    document.getElementById("conjunto").value = "";
    document.getElementById("telefono").value = "";
    document.getElementById("correo").value = "";
    currentDNI = "";
    clearMessage();
    document.getElementById("dni").focus();
  }

  function showMessage(msg, type) {
    const container = document.getElementById("status-message");
    container.className = `alert alert-${type}`;
    container.innerText = msg;
  }

  function clearMessage() {
    const container = document.getElementById("status-message");
    container.className = "";
    container.innerText = "";
  }
</script>

</body>
</html>
