<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby4seyhhepXTXdmt0HSjM0i-rfvqQVElXmihx_6DiVRTnpG_yKNBPE7Rs6q3pBUhGvs/exec";
  const APIS_PERU_TOKEN = "eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJlbWFpbCI6ImF6YW5nYXJvLnNhbHVkQGdtYWlsLmNvbSJ9.EsPl6VAmtt6x0vnq-o9IRBFf3lE7L85lecVonoK8rgk";

  let currentDNI = "";
  let html5QrCode = null;
  let isProcessingScan = false;

  document.addEventListener("DOMContentLoaded", () => {
    cargarInfoInicial();

    const dniInput = document.getElementById("dni");
    
    dniInput.addEventListener("keypress", function(event) {
      if (event.key === "Enter") {
        event.preventDefault();
        this.value = this.value.replace(/[^0-9]/g, '').substring(0, 8);
        buscarUsuario();
      }
    });

    dniInput.addEventListener("input", function(e) {
      this.value = this.value.replace(/[^0-9]/g, '');
    });

    // Filtro para el campo teléfono (permite números y el signo +)
    document.getElementById("telefono").addEventListener("input", function(e) {
      this.value = this.value.replace(/[^0-9+]/g, '');
    });

    document.getElementById("correo").addEventListener("input", function() {
      this.value = this.value.toLowerCase();
    });
  });

  /* ===================================================
     LÓGICA DEL ESCÁNER DE CÓDIGO QR
     =================================================== */
  async function iniciarEscaner() {
    clearMessage();
    document.getElementById("qr-container").classList.remove("hidden");
    document.getElementById("dni-container").classList.add("hidden");
    
    isProcessingScan = false;

    if (html5QrCode) {
      try { await html5QrCode.clear(); } catch(e) {}
    }

    html5QrCode = new Html5Qrcode("reader");
    const config = { fps: 10, qrbox: { width: 220, height: 220 } };

    html5QrCode.start(
      { facingMode: "environment" }, 
      config, 
      onScanSuccess
    ).catch(err => {
      showMessage("No se pudo acceder a la cámara o el navegador bloqueó el permiso.", "error");
      detenerEscaner();
    });
  }

  async function onScanSuccess(decodedText) {
    if (isProcessingScan) return;
    isProcessingScan = true;

    let dniLimpio = decodedText.trim().replace(/[^0-9]/g, '');
    
    if (dniLimpio.length > 8) {
      dniLimpio = dniLimpio.substring(0, 8);
    }

    if (dniLimpio && dniLimpio.length === 8) {
      await detenerEscaner();
      document.getElementById("dni").value = dniLimpio;
      await buscarUsuario();
    } else {
      showMessage("El código QR no contiene un DNI válido de 8 dígitos.", "error");
    }
    
    isProcessingScan = false;
  }

  async function detenerEscaner() {
    if (html5QrCode && html5QrCode.isScanning) {
      try {
        await html5QrCode.stop();
        html5QrCode.clear();
      } catch (err) {
        console.warn("Error al detener cámara:", err);
      } finally {
        ocultarUIEscaner();
      }
    } else {
      ocultarUIEscaner();
    }
  }

  function ocultarUIEscaner() {
    document.getElementById("qr-container").classList.add("hidden");
    document.getElementById("dni-container").classList.remove("hidden");
  }

  /* ===================================================
     FLUJO PRINCIPAL DE ASISTENCIA
     =================================================== */
  async function cargarInfoInicial() {
    try {
      const response = await fetch(`${SCRIPT_URL}?action=obtener_info_inicial`);
      const result = await response.json();
      
      if (result.success) {
        if (result.evento) {
          document.getElementById("event-badge").innerHTML = `📍 <strong>Evento Activo:</strong> ${result.evento.nombre}`;
        } else {
          document.getElementById("event-badge").innerHTML = "⚠️ <strong>No hay eventos activos</strong>";
        }
        if (result.conjuntos) {
          poblarComboConjuntos(result.conjuntos);
        }
      }
    } catch (e) {
      document.getElementById("event-badge").innerText = "Error al cargar el evento";
    }
  }

  function poblarComboConjuntos(lista) {
    const select = document.getElementById("conjunto");
    select.innerHTML = '<option value="">-- Seleccione un Conjunto --</option>';
    lista.forEach(item => {
      const option = document.createElement("option");
      option.value = item;
      option.textContent = item;
      select.appendChild(option);
    });
  }

  async function buscarUsuario() {
    const dniInput = document.getElementById("dni").value.trim();
    
    if (!dniInput) {
      showMessage("Ingrese un número de DNI.", "error");
      return;
    }
    if (dniInput.length !== 8 || !/^[0-9]{8}$/.test(dniInput)) {
      showMessage("El DNI debe tener exactamente 8 dígitos numéricos.", "error");
      return;
    }

    currentDNI = dniInput;
    showMessage("Validando información...", "info");
    document.getElementById("btn-buscar").disabled = true;

    try {
      // 1. Consultar en tu base de datos de Google Sheets
      const response = await fetch(`${SCRIPT_URL}?action=buscar&dni=${encodeURIComponent(dniInput)}`);
      const result = await response.json();

      document.getElementById("btn-buscar").disabled = false;

      if (result.success) {
        if (result.yaRegistradoEnEvento) {
          showWarningScreen(`El DNI <strong>${currentDNI}</strong> ya registró asistencia previamente para el evento <strong>"${result.evento.nombre}"</strong>.`);
        } else if (result.encontrado && result.asistenciaMarcada) {
          showSuccessScreen(`¡Bienvenido/a <strong>${result.usuario.nombres} ${result.usuario.apellidos}</strong>!<br>Tu asistencia ha sido registrada para <strong>"${result.evento.nombre}"</strong>.`);
        } else {
          // El DNI NO existe en la base de datos local -> Mostrar formulario y consultar APIS Perú
          clearMessage();
          if (result.conjuntos) poblarComboConjuntos(result.conjuntos);
          
          document.getElementById("reg-dni").value = currentDNI;

          // 2. Consultar directamente a APIS Perú desde el cliente
          showMessage("Buscando nombres en RENIEC...", "info");
          try {
            const apiRes = await fetch(`https://dniruc.apisperu.com/api/v1/dni/${currentDNI}?token=${APIS_PERU_TOKEN}`);
            const apiData = await apiRes.json();

            if (apiData.success) {
              document.getElementById("nombres").value = (apiData.nombres || "").toUpperCase();
              const apellidosCompletos = `${apiData.apellidoPaterno || ""} ${apiData.apellidoMaterno || ""}`.trim().toUpperCase();
              document.getElementById("apellidos").value = apellidosCompletos;
            } else {
              document.getElementById("nombres").value = "";
              document.getElementById("apellidos").value = "";
            }
          } catch (apiErr) {
            console.error("Error al consultar APIS Perú:", apiErr);
            document.getElementById("nombres").value = "";
            document.getElementById("apellidos").value = "";
          }

          clearMessage();
          document.getElementById("step-search").classList.add("hidden");
          document.getElementById("step-register").classList.remove("hidden");
        }
      } else {
        showMessage("Error: " + result.message, "error");
      }
    } catch (error) {
      document.getElementById("btn-buscar").disabled = false;
      showMessage("Error al conectar con la base de datos.", "error");
    }
  }

  async function registrarNuevo() {
    const nombres = document.getElementById("nombres").value.trim().toUpperCase();
    const apellidos = document.getElementById("apellidos").value.trim().toUpperCase();
    const conjunto = document.getElementById("conjunto").value.trim().toUpperCase();
    const telefono = document.getElementById("telefono").value.trim();
    const correo = document.getElementById("correo").value.trim().toLowerCase();

    if (!nombres || !apellidos || !conjunto) {
      showMessage("Por favor complete Nombres, Apellidos y seleccione un Conjunto.", "error");
      return;
    }

    showMessage("Guardando registro y marcando asistencia...", "info");
    document.getElementById("btn-guardar").disabled = true;

    try {
      const response = await fetch(SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          action: "registrar_nuevo",
          dni: currentDNI,
          nombres: nombres,
          apellidos: apellidos,
          conjunto: conjunto,
          telefono: telefono,
          correo: correo
        })
      });
      const result = await response.json();

      document.getElementById("btn-guardar").disabled = false;

      if (result.success) {
        showSuccessScreen(`¡Bienvenido/a <strong>${result.nombres} ${result.apellidos}</strong>!<br>Tus datos fueron guardados y tu asistencia fue marcada para <strong>"${result.evento.nombre}"</strong>.`);
      } else {
        showMessage("Error: " + result.message, "error");
      }
    } catch (error) {
      document.getElementById("btn-guardar").disabled = false;
      showMessage("Error de conexión al guardar los datos.", "error");
    }
  }

  function showSuccessScreen(htmlText) {
    clearMessage();
    hideAllSteps();
    document.getElementById("success-message-text").innerHTML = htmlText;
    document.getElementById("step-success").classList.remove("hidden");
  }

  function showWarningScreen(htmlText) {
    clearMessage();
    hideAllSteps();
    document.getElementById("warning-message-text").innerHTML = htmlText;
    document.getElementById("step-warning").classList.remove("hidden");
  }

  function hideAllSteps() {
    document.getElementById("step-search").classList.add("hidden");
    document.getElementById("step-register").classList.add("hidden");
    document.getElementById("step-success").classList.add("hidden");
    document.getElementById("step-warning").classList.add("hidden");
  }

  function resetForm() {
    detenerEscaner();
    hideAllSteps();
    document.getElementById("step-search").classList.remove("hidden");

    document.getElementById("dni").value = "";
    document.getElementById("reg-dni").value = "";
    document.getElementById("nombres").value = "";
    document.getElementById("apellidos").value = "";
    document.getElementById("conjunto").value = "";
    document.getElementById("telefono").value = "";
    document.getElementById("correo").value = "";
    currentDNI = "";
    clearMessage();
    document.getElementById("dni").focus();
  }

  function showMessage(msg, type) {
    const container = document.getElementById("status-message");
    container.className = `alert alert-${type}`;
    container.innerText = msg;
  }

  function clearMessage() {
    const container = document.getElementById("status-message");
    container.className = "";
    container.innerText = "";
  }
</script>
